version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: quiz_exam_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: quiz_exam_db
    ports:
      - "3307:3306"
    volumes:
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: quiz_exam_web
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: quiz_exam_db
      FLASK_SECRET_KEY: group09_quiz_exam_secret_key
    depends_on:
      db:
        condition: service_healthy